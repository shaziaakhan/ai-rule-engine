[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_rule_agent"
dynamic = ["version"]
description = "Reusable and extensible Business Rule Engine for dynamic validation and decision automation."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
  { name = "Shazia Khan", email = "shazia.khan@nihilent.com" }
]

keywords = [
  "business-rules",
  "rule-engine",
  "validation",
  "automation",
  "data-quality",
  "reusable-engine",
  "decision-engine"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries"
]

dependencies = [
  "pyyaml>=6.0",
  "fastapi",
  "uvicorn",
  "semantic-kernel>=1.14.0",
  "openai>=1.3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "build>=0.10.0",
  "twine>=4.0.0",
  "ruff>=0.4.0",
  "black>=24.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_rule_agent", "ai_rule_agent.*"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "ai_rule_agent.__version__"}

[tool.pytest.ini_options]
addopts = "-v --cov=ai_rule_agent --cov-report=term-missing"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100


